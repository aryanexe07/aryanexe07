<svg width="660" height="320" viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="pfpClip">
      <circle cx="50" cy="50" r="38"/>
    </clipPath>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="660" height="320" rx="20" ry="20"/>
    </clipPath>
    <linearGradient id="fadeOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="black" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="black" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="black" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="https://aryan-exe.vercel.app/">

    <!-- BANNER / BACKGROUND IMAGE -->
    <image href="https://github.com/aryanexe07/aryanexe07/blob/main/assets/banner.png" x="0" y="0" width="660" height="320" preserveAspectRatio="xMidYMid slice"/>

    <!-- dark overlay so text is readable -->
    <rect x="0" y="0" width="660" height="320" fill="url(#fadeOverlay)"/>

    <!-- PROFILE PICTURE -->
    <image href="https://github.com/aryanexe07/aryanexe07/blob/main/assets/pfp.png" x="12" y="12" width="76" height="76" clip-path="url(#pfpClip)"/>

    <!-- BORDER RING OVER PFP -->
    <image href="https://github.com/aryanexe07/aryanexe07/blob/main/assets/border.png" x="2" y="2" width="96" height="96"/>

    <!-- NAME -->
    <text x="105" y="38" font-family="Segoe UI, Verdana, sans-serif" font-size="24" font-weight="700" fill="#ffffff">
      aryanexe07~
    </text>
