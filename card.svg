    <circle cx="70" cy="110" r="42" fill="none" stroke="#ff4655" stroke-width="2"/>

    <g font-family="Arial, sans-serif">
      <text x="136" y="106" font-size="27" font-weight="800" fill="#ece8e1" letter-spacing="0.5">aryanexe07</text>
      <rect x="286" y="88" width="44" height="20" rx="5" fill="#59d9c5" fill-opacity="0.15" stroke="#59d9c5" stroke-opacity="0.7"/>
      <text x="308" y="102" font-size="10" font-weight="700" fill="#59d9c5" text-anchor="middle" letter-spacing="0.5">DEV</text>

      <circle cx="139" cy="128" r="4" fill="#3ecf6e">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="150" y="132" font-size="13" fill="#c8c9ce">Full-stack Dev · AI/ML Intern</text>

      <text x="136" y="152" font-size="11.5" fill="#7a7d85" letter-spacing="0.3">CSE @ SRM · building things</text>
    </g>
