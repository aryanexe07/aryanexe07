<svg width="600" height="260" viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="598" height="258" rx="18" ry="18"/>
    </clipPath>
    <clipPath id="pfpClip">
      <circle cx="70" cy="110" r="42"/>
    </clipPath>
    <linearGradient id="bannerFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="#0b0d10" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0d10" stop-opacity="1"/>
    </linearGradient>
    <pattern id="scan" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ff4655" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="600" height="260" fill="#0b0d10"/>

  
    <image href="assets/banner.png" x="0" y="0" width="600" height="140"
           preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="0" width="600" height="140" fill="url(#bannerFade)"/>

    <rect x="0" y="140" width="600" height="120" fill="url(#scan)"/>
    <g stroke="#ffffff" stroke-opacity="0.04">
      <line x1="0" y1="160" x2="600" y2="160"/>
      <line x1="0" y1="180" x2="600" y2="180"/>
      <line x1="0" y1="200" x2="600" y2="200"/>
      <line x1="0" y1="220" x2="600" y2="220"/>
      <line x1="0" y1="240" x2="600" y2="240"/>
    </g>

    <g font-family="Arial, sans-serif" font-size="11" font-weight="700">
