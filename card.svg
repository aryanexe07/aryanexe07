      <circle cx="23.8" cy="129.1" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="1.05s" repeatCount="indefinite"/></circle>
      <circle cx="20" cy="110" r="2.2" fill="#ff4655"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="23.8" cy="90.9" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="1.35s" repeatCount="indefinite"/></circle>
      <circle cx="34.6" cy="74.6" r="2" fill="#59d9c5"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="50.9" cy="63.8" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="1.65s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="60" r="2.2" fill="#ff4655"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="89.1" cy="63.8" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="1.95s" repeatCount="indefinite"/></circle>
      <circle cx="105.4" cy="74.6" r="2" fill="#59d9c5"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="116.2" cy="90.9" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="2.25s" repeatCount="indefinite"/></circle>
      <animateTransform attributeName="transform" type="rotate" from="0 70 110" to="360 70 110" dur="16s" repeatCount="indefinite"/>
    </g>

    <circle cx="70" cy="110" r="45" fill="#0b0d10"/>
    <!-- PFP: replace href with your profile picture path/URL -->
    <image href="assets/pfp.png" x="28" y="68" width="84" height="84"
