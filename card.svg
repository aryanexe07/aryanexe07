      <text x="542" y="32" fill="#ff4655" text-anchor="middle" letter-spacing="1">DEV MODE</text>
    </g>

    <g id="sparkles" fill="#ffffff">
      <circle cx="120" cy="110" r="2.2" fill="#ff4655"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="116.2" cy="129.1" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="0.15s" repeatCount="indefinite"/></circle>
      <circle cx="105.4" cy="145.4" r="2" fill="#59d9c5"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="89.1" cy="156.2" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="0.45s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="160" r="2.2" fill="#ff4655"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="50.9" cy="156.2" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="0.75s" repeatCount="indefinite"/></circle>
